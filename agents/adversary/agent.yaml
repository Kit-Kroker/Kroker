# Spec 3.1: the decorrelated second opinion. Runs ONLY when the primary
# reviewer approves -- a rejection is already headed for the fix loop, so the
# expensive error is a false approve.
#
# The model must not BE dev's or reviewer's model (check_adversary_model,
# by model id -- NOT by provider prefix; see spec OQ-A4). glm-5.3-flash is a
# different model id from dev (glm-5.3) and reviewer (glm-5.3), which is all
# the check requires; it is the same vendor family, so the decorrelation is
# weaker than the claude-sonnet-4-6 it replaced.
kind: proposer
model: zai:glm-5.3-flash
