# Spec 3.1: the decorrelated second opinion. Runs ONLY when the primary
# reviewer approves -- a rejection is already headed for the fix loop, so the
# expensive error is a false approve.
#
# The model must not BE dev's or reviewer's model (check_adversary_model,
# by model id -- NOT by provider prefix; see spec OQ-A4). Since 07232332 put
# this role on glm-5.3-flash while R019 re-paired the corpus weak arm onto
# the same model, every weak-arm benchmark cell died at the ADR-6 boundary
# (adversary id == dev id). claude-sonnet-5 shares no id with either corpus
# arm (glm-5.3 / glm-5.3-flash) or the reviewer (zai:glm-5.3) and restores
# the cross-family decorrelation of the original claude-sonnet-4-6 design.
kind: proposer
model: anthropic:claude-sonnet-5
