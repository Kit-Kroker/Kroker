# FR-113: drafts the run's user stories from the idea (and, brownfield,
# the repo's own product intent). A proposer — FR-204/ADR-6 constrains
# judge-vs-dev pairs, not proposer-proposer, so it shares research's and
# constitution's capable tier (a grounded, repo-reading proposer). Editing
# the model here is configuration, not a code change.
kind: proposer
model: zai:glm-5.3
# FR-202: the validated-output retry budget the drafter's run site forwards
# per call (same value the role used to pin at construction — planner/
# research precedent: a malformed draft re-prompts with the validation error,
# so 3 gives the self-correction loop room).
validation_retries: 3
