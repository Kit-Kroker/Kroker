[package]
name = "kroker-mcp"
version = "0.1.0"
edition = "2024"
description = "Kroker's MCP channel adapter: a stdio MCP server backed by the Python verb bridge (E-11, FR-602)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "kroker-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "~3.10", default-features = false, features = [
    "server",
    "transport-io",
    "elicitation",
    "schemars",
    "request-state",
] }
tokio = { version = "~1.54", features = [
    "process",
    "io-util",
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
schemars = "~1.2"
sha2 = "~0.11"
getrandom = "~0.4"
uuid = { version = "~1.29", features = ["v4"] }
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "~0.2"

[dev-dependencies]
rmcp = { version = "~3.10", default-features = false, features = ["client"] }
tokio = { version = "~1.54", features = ["test-util"] }
