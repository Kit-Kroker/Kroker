# The coding layout. Two roles: the lead writes, the critic reviews. The
# reviewer slot in the parent spec's round shape stays empty -- it needs a
# third vendor (cursor installed, or an agy adapter), see finding 10.
layout: code
lead: coder
crew: [coder, critic]
rounds:
  # Two, not one. Step 1 shipped `max: 1` reasoning that the factory already
  # retries -- true, but a critic writes advisor.md and the ONLY thing that
  # can read it is the next round's brief. At max 1 the critic is spend with
  # no consumer, so the round bound and the critic arrive together.
  max: 2
  require_reviewer_approval: false
deliverable:
  # Relative to the ROUND directory. The diff itself is captured by git, so
  # this note is not the work -- it records the decisions and known gaps the
  # diff cannot state, and it fills HarnessRunResult.summary.
  path: notes.md
  schema: notes-v1
limits:
  wall_clock_s: 3000
  turn_timeout_s: 1800
  cost_usd: 25.0
