[project]
name = "ai-sdlc-temporal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9",
    "pydantic>=2.7",
    "pydantic-ai-slim[anthropic,openai,temporal]>=0.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pydantic-ai-harness[codemode]>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: builds a venv or otherwise takes >10s"]
