[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-temporal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[anthropic,openai,google,temporal]>=0.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "genai-prices>=0.0.60",
    "pydantic-ai-harness[codemode,exa]>=0.7",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5",
    # Turns the temporal gate/wait hangs (Follow-up 1) into failures with a
    # stack dump, so the tier completes and names its stall point.
    "pytest-timeout>=2",
    "jsonschema>=4",
    "ruff>=0.16.5",
    "mypy>=2.3",
    "pre-commit>=4",
]
logfire = ["logfire[pydantic-ai]>=4.41.0"]
# E-82 prompt gate. Deliberately NOT in `dev`: promptfoo is Node-backed, and
# a contributor who only runs unit tests should not have to install it.
# NOTE the version line: PyPI `promptfoo` is the thin Python wrapper
# (github.com/promptfoo/promptfoo-python, 0.1.x) that shells to the npm CLI,
# whose own versions are 0.11x. Do NOT "correct" this floor to an npm number.
# Needs Node >= 22.22 on PATH.
eval = ["promptfoo>=0.1.4"]

[tool.ruff]
target-version = "py311"
line-length = 100
# benchmarks/cases/** are vendored fixtures (third-party reference repos and
# their oracle tests) — data, not product code. Keep them byte-stable.
# docs/superpowers/** are write-once historical records (same rationale as the
# file-size ratchet's exemption in scripts/check_file_size.py). ruff format
# rewrites python fences inside .md and dedents body-context snippets to module
# level, which corrupts approved plan artifacts.
extend-exclude = ["benchmarks/cases", "docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv()/logging.basicConfig must run before the imports they configure.
"src/sdlc/worker.py" = ["E402"]
# tests routinely set env vars / tweak sys.path before importing the package.
"tests/**" = ["E402"]
# FastAPI's `Depends()` in parameter defaults is the framework's own idiom.
"src/sdlc/board/api.py" = ["B008"]
# embedded HTML/CSS/JS template strings — line length is meaningless there
"scripts/aggregate_benchmarks.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# Default run = fast unit tests only. `slow` (venv builds, real pip installs)
# and `temporal` (each test spawns its own ephemeral Temporal dev-server
# subprocess via WorkflowEnvironment.start_time_skipping; 22 such tests
# contend and freeze the suite when run together) are opt-in:
#   pytest                          # fast unit only
#   pytest -m temporal              # integration tests only
#   pytest -m "slow or temporal"    # everything
#   pytest -m ""                    # truly everything (overrides addopts)
addopts = "-q -m 'not slow and not temporal and not docker and not prompt_eval and not crew'"
markers = [
    "slow: builds a venv or otherwise takes >10s",
    "temporal: spawns an ephemeral Temporal dev-server via WorkflowEnvironment",
    "live: spawns a real harness CLI and spends tokens; skipped unless SDLC_LIVE_TESTS=1",
    "prompt_eval: A/B-scores a role prompt against a fixture; spends tokens; skipped unless SDLC_PROMPT_EVAL=1",
    "docker: requires a running Docker daemon; builds and runs real containers",
    "crew: needs a real coding CLI on PATH; drives one crew round end to end",
    "clause: cites a numbered clause from a slice's <stage>.md contract",
]
