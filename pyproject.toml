[project]
name = "ai-sdlc-temporal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9",
    "pydantic>=2.7",
    "pydantic-ai-slim[anthropic,openai,google,temporal]>=0.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "genai-prices>=0.0.60",
    "pydantic-ai-harness[codemode,exa]>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]
logfire = ["logfire[pydantic-ai]>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run = fast unit tests only. `slow` (venv builds, real pip installs)
# and `temporal` (each test spawns its own ephemeral Temporal dev-server
# subprocess via WorkflowEnvironment.start_time_skipping; 22 such tests
# contend and freeze the suite when run together) are opt-in:
#   pytest                          # fast unit only
#   pytest -m temporal              # integration tests only
#   pytest -m "slow or temporal"    # everything
#   pytest -m ""                    # truly everything (overrides addopts)
addopts = "-q -m 'not slow and not temporal'"
markers = [
    "slow: builds a venv or otherwise takes >10s",
    "temporal: spawns an ephemeral Temporal dev-server via WorkflowEnvironment",
    "live: spawns a real harness CLI and spends tokens; skipped unless SDLC_LIVE_TESTS=1",
]
