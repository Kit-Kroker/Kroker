# FR-404 — nightly memory consolidation. Project banks consolidate first;
# gotchas recurring in 2+ of them then promote into the org bank, which
# reflects too. Org gets its writers via this nightly promotion (E-25) —
# never via a `banks:` entry, which would consolidate an unwritten bank.
#
# Applied with: python -m sdlc.cli schedules apply --dry-run
spec:
  cron: "0 3 * * *"
  timezone: UTC
action:
  workflow: ReflectWorkflow
  banks:
    - "project:default"
  backend: hindsight
  base_url: "http://localhost:8888"
  org_bank: "org"
