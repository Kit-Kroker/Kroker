name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest > /tmp/pytest.log 2>&1; status=$?; tail -3 /tmp/pytest.log; exit $status

      # The raw Actions log needs a sign-in to read; the repo does not.
      # Publishing the failing run's log to an orphan branch keeps the
      # failure publicly diagnosable. Remove once main is green again.
      - name: Publish test log
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git switch --orphan "ci/logs-${GITHUB_RUN_ID}"
          cp /tmp/pytest.log .
          git add pytest.log
          git commit -m "pytest log for run ${GITHUB_RUN_ID}"
          git push origin "HEAD:ci/logs-${GITHUB_RUN_ID}"
