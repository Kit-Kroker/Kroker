name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: |
          pytest > /tmp/pytest.log 2>&1; status=$?
          {
            echo '### pytest result'
            echo '```'
            grep -E "FAILED|ERROR|=+ .*(passed|failed|error).* =+|^E  " /tmp/pytest.log | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/pytest.log
          exit $status
