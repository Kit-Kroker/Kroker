name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: File-size ratchet
        run: python scripts/check_file_size.py --full

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

      - name: Pytest (temporal tier)
        # The authoritative gate for the gate/wait temporal tests: they
        # deadlock in the local Windows environment (see the plan's
        # Follow-up 1 for the documented class), so this tier only runs
        # here, on Linux.
        run: pytest -m temporal -v
        env:
          PYTHONUNBUFFERED: 1
        timeout-minutes: 60
