name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: |
          pytest > /tmp/pytest.log 2>&1; status=$?
          # Surface the failing tests as annotations: the raw log needs a
          # sign-in to read, annotations do not.
          grep -E "^FAILED|^ERROR" /tmp/pytest.log | head -10 | while read -r line; do
            echo "::error title=pytest::${line:0:250}"
          done
          grep -E "=+ .*(passed|failed|error).* =+" /tmp/pytest.log | tail -2
          exit $status
