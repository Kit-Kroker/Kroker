name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/configure-pages@v5

      # Everything below runs from uv.lock: pip resolved the floors
      # independently and a fresh pydantic/temporalio generation broke the
      # import-time TypeAdapter inside pydantic_ai.durable_exec.temporal
      # (EventGroup field, first seen 2026-10-02) while the locked test job
      # stayed green. Mirrors ci.yml's install for the same reason.
      - name: Install uv
        run: pip install uv

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen --extra dev --extra docs

      - name: Docs-site unit tests
        run: uv run --no-sync pytest tests/docs_site -v

      - name: Build site (strict)
        run: uv run --no-sync mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
