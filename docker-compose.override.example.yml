# Per-machine additions to docker-compose.yml. Copy to
# docker-compose.override.yml (gitignored; compose loads it automatically)
# and keep only the parts you need. Paths on the left are host paths.
services:
  worker:
    volumes:
      # Local repositories the pipeline may work on, referenced in a run as
      # /srv/scratch-repos/<name>. Everything mounted here is readable and
      # writable by the code a run builds and tests (SECURITY.md).
      - /path/to/your/repos:/srv/scratch-repos

      # The harness roles (dev, test, devops) run `opencode`, which
      # authenticates from its own login rather than from .env. Log in on
      # the host once (`opencode auth login`) and share the result read-only, so
      # the container can resolve the provider without clobbering host state.
      # Linux/macOS:
      - ~/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json:ro
      # Windows: the same file lives under
      # C:/Users/<you>/.local/share/opencode/auth.json.
      #
      # Do NOT add ~/.cache/opencode/models.json here
      # (opencode-bootstrap-ebusy-models-json): opencode REPLACES that
      # cache via write-tmp + rename at bootstrap, and a single-file bind
      # mount turns the rename target into a mount point — the rename
      # fails EBUSY and every coding attempt dies. Share auth.json only;
      # the worker fetches models.dev itself into its own writable layer.

  # One shared runs/ tree: docker-compose.yml mounts a named volume at
  # /app/runs unless KROKER_RUNS_BIND names a host path. Set it in .env
  # (compose reads that file for interpolation) so pipeline exports,
  # benchmark records and host-side tooling all see the same tree:
  #   KROKER_RUNS_BIND=/path/to/this/checkout/runs

  # Round 016: the private cases store, read alongside the in-repo
  # corpus (SDLC_PRIVATE_CASES_ROOT). <store> is a host directory
  # OUTSIDE this repository holding private benchmark cases as
  # <store>/cases/<case_id>/... — never commit its path or its content.
  # The worker mounts it read-only and learns it via environment (an
  # explicit entry here wins over env_file); kroker-dev mounts it
  # read-write because `sdlc benchmark accept` writes acceptance.yaml
  # into the case dir. Also add to the host .env (for the host CLI):
  #   SDLC_PRIVATE_CASES_ROOT=<store>\cases
  # worker:
  #   volumes:
  #     - <store>/cases:/srv/private-cases:ro
  #   environment:
  #     SDLC_PRIVATE_CASES_ROOT: /srv/private-cases
  # kroker-dev:
  #   volumes:
  #     - <store>/cases:/srv/private-cases
