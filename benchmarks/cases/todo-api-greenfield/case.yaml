case_id: todo-api-greenfield
idea_summary: Build a simple TODO REST API (CRUD) as a fresh greenfield service.
description: |
  A small greenfield feature: CRUD endpoints for todo items (create, list,
  update, delete), backed by a single data store, no auth. Exercises
  architect (stack + storage choice), planner (task decomposition), and dev
  (a couple of implementation tasks with a frozen contract). Sized for a
  single short factory run.
  Implement in Python. Expose an ASGI application object importable as
  `app:app` (module `app.py` at the repo root, attribute named `app`)
  serving the CRUD routes over HTTP:
    POST   /todos      {title}       -> 201 {id, title, done}
    GET    /todos                    -> 200 [ ... ]
    GET    /todos/{id}               -> 200 {id, title, done} | 404
    PUT    /todos/{id}  {title,done} -> 200 {id, title, done} | 404
    DELETE /todos/{id}               -> 204 ; subsequent GET -> 404
  Storage and framework are your choice, as long as the app is ASGI and
  importable as `app:app`.
mode: greenfield
language: python
repo_url: /srv/scratch-repos/todo-api-greenfield
role: smoke
visibility: private
research_enabled: true
harnesses:
  - opencode
models:
  - zai-coding-plan/glm-5.3
  - zai-coding-plan/glm-5.3-flash
judge_model: anthropic:claude-sonnet-5     # different family than the author (ADR-6); gemini free tier lost R0 attempts 5, 8, 10, 11 to 503 waves and daily 429 quota
# extra_args_by_model dropped 2026-10-26: z.ai marked glm-5.2 deprecated
# in the models.dev catalog (opencode filters deprecated models at
# resolution), and glm-5.3 / glm-5.3-flash declare no opencode variants,
# so the old `--variant max` for glm-5.2 has no successor.
rubrics:
  architect: rubric-architect.md
  clarifier: rubric-clarifier.md
