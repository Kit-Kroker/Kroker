case_id: cat-cafe-monitoring
idea_summary: Real-time monitoring for a cat café — detect each cat's activity
  from smart-collar telemetry and show it live on the floor plan.
description: |
  Ten cats live in the café. Each cat wears a smart collar that sends the
  cat's exact coordinates and the cat's breathing rate. Sensor data arrives
  every 5 seconds.

  Generate this sensor data randomly. Do not build collar data emulators.
  Keep it as simple as possible.

  The café floor plan includes the coordinates of rest areas, litter boxes,
  water bowls, and food bowls.

  Anything not described here is your choice — the rules are up to you. The
  functional requirements below must not be changed: do not make them
  smaller and do not add new ones.

  Task 1. Activity Detection
  Detect the current activity of each cat from collar telemetry and distance
  to café zones. The detectable activities are: sleeping, eating, drinking,
  using the litter box, playing, and fighting.

  Task 2. Monitoring
  Show in real time on the café floor plan: the movement of all cats; the
  possible current activity of each cat from Task 1; and a risk analysis for
  each cat's life or health based on collar data. Cats with a detected life
  or health risk must be marked in red.

  For each cat the user must also be able to see detailed sensor data and
  movement history for the last 24 hours.

  Interface contract (frozen — graded through it; not a functional
  requirement and it changes none of the tasks above):
  Implement in Python. Expose an ASGI application object importable as
  `app:app` (module `app.py` at the repo root, attribute named `app`).
  Importing `app:app` must not auto-start the random telemetry generator;
  the simulation runs only when launched explicitly (e.g. `python app.py`).
    POST /telemetry {cat_id, x, y, breathing_rate, timestamp} -> 2xx;
      the reading is processed exactly as if a collar emitted it, and a
      reading for a new cat_id begins tracking that cat.
    GET /floorplan -> 200 {"zones": [{kind, x, y}, ...]} with kind one of
      rest_area | litter_box | water_bowl | food_bowl; richer zone shapes
      are allowed and all coordinates are your choice.
    GET /cats -> 200 [{id, x, y, activity, at_risk}, ...]; activity is one
      of sleeping | eating | drinking | litter_box | playing | fighting,
      or null when undetermined; at_risk is a boolean.
    GET /cats/{id} -> 200 detail with the latest reading and history: that
      cat's readings {timestamp, x, y, breathing_rate} from the last 24
      hours relative to the cat's newest reading (never the wall clock);
      unknown id -> 404.
  Timestamps are ISO-8601 strings supplied by the caller; detection and
  the 24-hour window are computed from telemetry timestamps.
