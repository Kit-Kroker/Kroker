# Pipeline-step benchmark defaults. Override per `benchmark run` invocation.
weights:
  quality: 0.6
  cost: 0.2
  speed: 0.2
# Default judge model — must differ from every author model in a case's matrix
# by BOTH family and identity (ADR-6). The matrix expander rejects same-family
# configs; the prompt gate additionally rejects same-identity ones.
#
# anthropic:claude-sonnet-5, not a glm or gemini judge: every author family in
# the corpus is zai (glm-5.3 / glm-5.3-flash since R019) or anthropic-route
# glm — claude-sonnet-5 is decorrelated on both axes. The earlier Gemini
# candidate lost case runs to free-tier 503 waves and daily 429 quota (see the
# judge comments on the R0-era case records); gemini is not re-candidated.
default_judge_model: anthropic:claude-sonnet-5
