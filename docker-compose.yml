services:
  temporal:
    image: temporalio/temporal:latest
    # Loopback only: the dev server has no auth, and reaching 7233 is enough
    # to start workflows and signal gate approvals (SECURITY.md).
    ports:
      - "127.0.0.1:7233:7233"   # gRPC
      - "127.0.0.1:8233:8233"   # Web UI
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
    # `server start-dev` with `--db-path` on a volume survives container
    # restarts and host reboots (in-memory default lost 2 full runs this
    # week). For real production swap in the full Temporal Server with
    # Postgres/Cassandra persistence.
    # uid 1000 (temporal) cannot write into a fresh named volume (root-owned
    # at first mount); run the dev server as root - local stack only.
    user: root
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/tmp/state/temporal.db"]
    volumes:
      - temporal-state:/tmp/state
    restart: unless-stopped

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    pull_policy: always
    ports:
      - "127.0.0.1:8888:8888"   # API
      - "127.0.0.1:9999:9999"   # Web UI
    # Optional so that `docker compose run --rm demo` works on a fresh clone.
    # Without its LLM key Hindsight does not come up; see .env.example.
    env_file:
      - path: .env
        required: false
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  worker:
    # Published by .github/workflows/release.yml on every v* tag. With both
    # `image` and `build` set, `docker compose pull worker` fetches the
    # published image and `docker compose up --build` builds this checkout
    # and tags it with the same name.
    image: ghcr.io/kit-kroker/kroker-worker:${KROKER_IMAGE_TAG:-latest}
    build:
      context: .
      # The Dockerfile is multi-stage: runtime is the worker image, dev is
      # the .devcontainer/ environment. Pin the target so compose never
      # follows the last stage in the file.
      target: runtime
    depends_on: ["temporal", "hindsight"]
    environment:
      TEMPORAL_HOST: "temporal:7233"
      # merge activity commits on the pipeline's behalf; git refuses to
      # commit with no identity configured ("Committer identity unknown")
      GIT_AUTHOR_NAME: "SDLC Benchmark Worker"
      GIT_AUTHOR_EMAIL: "sdlc-benchmark@localhost"
      GIT_COMMITTER_NAME: "SDLC Benchmark Worker"
      GIT_COMMITTER_EMAIL: "sdlc-benchmark@localhost"
    # Optional for the same reason as above. Without the provider keys the
    # worker exits at boot, naming the missing one.
    env_file:
      - path: .env
        required: false
    volumes:
      # worktrees need persistent storage across activity retries
      - worker-worktrees:/tmp/sdlc/worktrees
      # repos cloned / pushed to by the pipeline live here
      - worker-repos:/srv/repos
      # benchmark records/reports/matrices (LocalFileStore, recorder.py) —
      # otherwise part of the container's writable layer and wiped on every
      # rebuild/recreate (lost 5 runs' worth of today's history to exactly
      # this before adding the mount)
      - worker-runs:/app/runs
      # Host bind mounts (your repositories, the host's opencode login) are
      # per-machine and live in docker-compose.override.yml, which compose
      # loads automatically -- see docker-compose.override.example.yml.
    restart: unless-stopped

  # Token-free dry run: `docker compose run --rm demo`. The real workflow on
  # the Temporal above, with scripted agents and activities (src/sdlc/demo/)
  # -- no .env, no keys, no login, no repository. Behind a profile so that
  # `docker compose up` never starts it.
  demo:
    profiles: ["demo"]
    image: ghcr.io/kit-kroker/kroker-worker:${KROKER_IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    depends_on: ["temporal"]
    environment:
      TEMPORAL_HOST: "temporal:7233"
    command: ["python", "-m", "sdlc.demo"]
    volumes:
      # report.html / events.jsonl / summary.json land beside real runs'
      - worker-runs:/app/runs

volumes:
  worker-worktrees:
  worker-repos:
  worker-runs:
  hindsight-data:
  temporal-state:
