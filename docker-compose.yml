services:
  temporal:
    image: temporalio/temporal:latest
    ports:
      - "7233:7233"   # gRPC
      - "8233:8233"   # Web UI
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
    # `temporal cli start` runs an embedded server — enough for a single-node
    # dev/mini-prod setup. For real production swap in the full Temporal Server
    # with Postgres/Cassandra persistence.
    command: ["server", "start-dev", "--ip", "0.0.0.0"]

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    pull_policy: always
    ports:
      - "8888:8888"   # API
      - "9999:9999"   # Web UI
    env_file: [".env"]
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  worker:
    build: .
    depends_on: ["temporal", "hindsight"]
    environment:
      TEMPORAL_HOST: "temporal:7233"
    env_file: [".env"]
    volumes:
      # worktrees need persistent storage across activity retries
      - worker-worktrees:/tmp/sdlc/worktrees
      # repos cloned / pushed to by the pipeline live here
      - worker-repos:/srv/repos
      # host-side scratch repos referenced by benchmark case.yaml repo_url
      - D:/own/sdlc-scratch-repos:/srv/scratch-repos
    restart: unless-stopped

volumes:
  worker-worktrees:
  worker-repos:
  hindsight-data:
