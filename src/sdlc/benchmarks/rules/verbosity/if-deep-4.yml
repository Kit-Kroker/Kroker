# 015 verbosity rule set v1 (data-model §4).
# An if statement nested four deep; the innermost if's span is flagged.
id: if-deep-4
language: python
rule:
  kind: if_statement
  inside:
    stopBy: end
    kind: if_statement
    inside:
      stopBy: end
      kind: if_statement
      inside:
        stopBy: end
        kind: if_statement
